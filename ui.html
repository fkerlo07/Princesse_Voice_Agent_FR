<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <title>Jarvis</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #07060f;
      color: #e2e2f0;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* ── Ambient glow ──────────────────────────────────────────── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      position: relative;
      padding: 40px;
    }

    .main::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 60% 60% at 50% 50%,
          var(--glow, transparent) 0%, transparent 70%);
      pointer-events: none;
      transition: background 0.8s;
    }

    body.state-sleeping {
      --glow: rgba(80, 60, 140, .12);
    }

    body.state-listening {
      --glow: rgba(34, 197, 94, .15);
    }

    body.state-thinking {
      --glow: rgba(251, 191, 36, .15);
    }

    body.state-speaking {
      --glow: rgba(99, 102, 241, .20);
    }

    /* ── Face wrapper ──────────────────────────────────────────── */
    #face-wrap {
      position: relative;
      width: 300px;
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #face {
      transition: filter 0.5s;
    }

    body.state-sleeping #face {
      animation: breathe 4s ease-in-out infinite;
      filter: drop-shadow(0 0 30px rgba(100, 80, 180, .4));
    }

    body.state-thinking #face {
      animation: think-sway 2.5s ease-in-out infinite;
      filter: drop-shadow(0 0 50px rgba(251, 191, 36, .6));
    }

    body.state-listening #face {
      animation: listen-bob 1.2s ease-in-out infinite;
      filter: drop-shadow(0 0 50px rgba(34, 197, 94, .6));
    }

    body.state-speaking #face {
      filter: drop-shadow(0 0 60px rgba(99, 102, 241, .7));
    }

    @keyframes breathe {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.03);
      }
    }

    @keyframes think-sway {

      0%,
      100% {
        transform: rotate(0);
      }

      25% {
        transform: rotate(-1.5deg);
      }

      75% {
        transform: rotate(1.5deg);
      }
    }

    @keyframes listen-bob {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-5px);
      }
    }

    /* ── Pulse rings ───────────────────────────────────────────── */
    .pulse-ring {
      position: absolute;
      inset: -20px;
      border-radius: 50%;
      border: 2px solid rgba(34, 197, 94, .35);
      opacity: 0;
      transition: opacity .4s;
    }

    .pulse-ring.r2 {
      inset: -44px;
      border-color: rgba(34, 197, 94, .15);
    }

    body.state-listening .pulse-ring {
      opacity: 1;
      animation: pulse 1.6s ease-out infinite;
    }

    body.state-listening .pulse-ring.r2 {
      animation: pulse 1.6s ease-out .5s infinite;
    }

    @keyframes pulse {
      0% {
        transform: scale(.92);
        opacity: .8;
      }

      100% {
        transform: scale(1.12);
        opacity: 0;
      }
    }

    /* ── Thinking orbit dots ───────────────────────────────────── */
    .think-orbit {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity .4s;
    }

    body.state-thinking .think-orbit {
      opacity: 1;
    }

    .think-dot {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #fbbf24;
      border-radius: 50%;
      box-shadow: 0 0 8px #fbbf24;
    }

    .think-dot:nth-child(1) {
      animation: orbit1 2.4s ease-in-out infinite;
    }

    .think-dot:nth-child(2) {
      animation: orbit1 2.4s ease-in-out .8s infinite;
    }

    .think-dot:nth-child(3) {
      animation: orbit1 2.4s ease-in-out 1.6s infinite;
    }

    @keyframes orbit1 {
      0% {
        transform: translate(152px, -8px) scale(.6);
        opacity: .3;
      }

      25% {
        transform: translate(8px, -152px) scale(1);
        opacity: 1;
      }

      50% {
        transform: translate(-152px, -8px) scale(.6);
        opacity: .3;
      }

      75% {
        transform: translate(-8px, 152px) scale(1);
        opacity: 1;
      }

      100% {
        transform: translate(152px, -8px) scale(.6);
        opacity: .3;
      }
    }

    /* ── ZZZ (sleeping) ────────────────────────────────────────── */
    .zzz-wrap {
      position: absolute;
      right: -20px;
      top: 30px;
      pointer-events: none;
      opacity: 0;
      transition: opacity .6s;
    }

    body.state-sleeping .zzz-wrap {
      opacity: 1;
    }

    .zzz {
      position: absolute;
      font-weight: 700;
      color: #9b8ec4;
      animation: float-zzz 3s ease-in-out infinite;
      right: 0;
    }

    .zzz:nth-child(1) {
      animation-delay: 0s;
      font-size: 13px;
      right: 12px;
    }

    .zzz:nth-child(2) {
      animation-delay: 1s;
      font-size: 17px;
      right: 2px;
    }

    .zzz:nth-child(3) {
      animation-delay: 2s;
      font-size: 21px;
      right: -8px;
    }

    @keyframes float-zzz {
      0% {
        transform: translate(0, 0) rotate(-5deg);
        opacity: 0;
      }

      20% {
        opacity: .8;
      }

      100% {
        transform: translate(28px, -58px) rotate(15deg);
        opacity: 0;
      }
    }

    /* ── SVG transitions ───────────────────────────────────────── */
    /* Eyelid paths transition via d attribute */
    #lid-l,
    #lid-r {
      transition: d 0.4s ease;
    }

    /* Glints fade with lids */
    #glint-l,
    #glint-r {
      transition: opacity 0.4s;
    }

    /* Brow opacity */
    #brows {
      transition: opacity 0.4s;
    }

    /* Mouth morphing */
    #mouth,
    #mouth-fill {
      transition: d 65ms ease-out, opacity 80ms;
    }

    /* ── Status badge ──────────────────────────────────────────── */
    #status-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, .05);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 30px;
      padding: 10px 24px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, .5);
      backdrop-filter: blur(10px);
    }

    #status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .3);
      transition: background .4s, box-shadow .4s;
    }

    body.state-sleeping #status-dot {
      background: #7c70c0;
    }

    body.state-listening #status-dot {
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    body.state-thinking #status-dot {
      background: #fbbf24;
      box-shadow: 0 0 8px #fbbf24;
      animation: dot-blink .8s steps(1) infinite;
    }

    body.state-speaking #status-dot {
      background: #818cf8;
      box-shadow: 0 0 8px #818cf8;
    }

    @keyframes dot-blink {
      50% {
        opacity: 0;
      }
    }

    /* ── Live text ─────────────────────────────────────────────── */
    #live-text {
      max-width: 520px;
      text-align: center;
      font-size: 16px;
      line-height: 1.6;
      color: rgba(255, 255, 255, .55);
      min-height: 52px;
    }

    /* ── Educational Display ───────────────────────────────────────── */
    #edu-wrap {
      /* Positioned below the buttons, taking up the remaining screen space */
      position: absolute;
      top: 15%;
      bottom: 20px;
      left: 20px;
      right: 20px;
      display: none;
      align-items: flex-start;
      /* Start from top instead of centering */
      justify-content: center;
      overflow-y: auto;
      /* Enable vertical scrolling */
      padding: 20px;

      font-size: 150px;
      font-weight: 700;
      color: #fbbf24;
      text-shadow: 0 0 50px rgba(251, 191, 36, 0.4);
      z-index: 10;
      letter-spacing: 5px;

      /* Custom scrollbar for webkit */
      scrollbar-width: thin;
      scrollbar-color: rgba(251, 191, 36, .5) transparent;
    }

    #edu-wrap::-webkit-scrollbar {
      width: 8px;
    }

    #edu-wrap::-webkit-scrollbar-thumb {
      background-color: rgba(251, 191, 36, .5);
      border-radius: 4px;
    }

    #edu-wrap.visible {
      display: flex;
    }

    #edu-wrap.grid-alpha {
      flex-wrap: wrap;
      max-width: 100%;
      gap: 15px 25px;
      font-size: 50px;
      /* Slightly smaller to fit desktop width */
    }

    #edu-wrap.grid-count {
      flex-wrap: wrap;
      max-width: 100%;
      gap: 15px 20px;
      font-size: 45px;
      /* Scaled down for 1-100 */
    }

    .edu-letter {
      display: inline-block;
      transition: all 0.3s ease;
    }

    .edu-letter.zoom {
      transform: scale(1.6);
      color: #34d399;
      text-shadow: 0 0 60px rgba(52, 211, 153, 0.6);
    }

    /* ── Educational Buttons ─────────────────────────────────────── */
    #edu-controls {
      display: flex;
      gap: 15px;
      margin-top: 10px;
      position: relative;   /* stay above the edu overlay */
      z-index: 30;
    }

    .btn-edu {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.7);
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .btn-edu:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      transform: translateY(-2px);
    }

    /* Buttons shown only during edu mode */
    .btn-edu-active {
      display: none;
    }
    .btn-edu-active.visible {
      display: block;
      animation: slideUp .3s ease;
    }

    #btn-stop-tts {
      background: rgba(251, 191, 36, 0.1);
      border-color: rgba(251, 191, 36, 0.3);
      color: #fbbf24;
      font-weight: 600;
    }
    #btn-stop-tts:hover {
      background: rgba(251, 191, 36, 0.2);
      color: #fde68a;
    }

    #btn-stop-edu {
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.3);
      color: #ef4444;
      font-weight: 600;
    }
    #btn-stop-edu:hover {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
    }

    /* ── Geography map ─────────────────────────────────────────── */
    #edu-wrap.geo-mode {
      font-size: 16px;
      font-weight: 400;
      letter-spacing: 0;
      text-shadow: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 16px;
      color: white;
    }

    #geo-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    #geo-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0 4px;
    }

    #geo-status {
      font-size: 17px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.85);
      letter-spacing: 0.5px;
    }

    #geo-score-display {
      font-size: 13px;
      font-weight: 600;
      color: #fbbf24;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    #world-map {
      flex: 1;
      width: 100%;
      border-radius: 12px;
      background: #0a0820;
      min-height: 0;
    }

    .geo-country {
      cursor: default;
      /* fill/stroke are set entirely by D3 .style() so CSS class never fights them */
    }

    /* ── Planet quiz ────────────────────────────────────────────── */
    #edu-wrap.planet-mode {
      font-size: 16px;
      font-weight: 400;
      letter-spacing: 0;
      text-shadow: none;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      color: white;
      padding: 0;
    }

    #planet-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #planet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 18px 4px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.45);
      flex-shrink: 0;
    }

    #planet-score { color: #fbbf24; }

    #planet-svg-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #planet-svg-wrap svg {
      max-height: 100%;
      width: auto;
    }

    #planet-clue-box {
      background: linear-gradient(135deg, rgba(28,22,72,.55), rgba(18,12,50,.55));
      border-top: 1px solid rgba(100,80,200,.18);
      padding: 13px 22px 16px;
      flex-shrink: 0;
      min-height: 76px;
    }

    #planet-clue-text {
      font-size: 14px;
      line-height: 1.72;
      color: rgba(215,210,255,.90);
      font-style: italic;
      animation: slideUp .35s ease;
    }

    .planet-name-badge {
      display: inline-block;
      font-size: 22px;
      font-weight: 700;
      color: #fbbf24;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 6px;
      animation: slideUp .4s ease;
    }

    /* ── Sidebar ───────────────────────────────────────────────── */
    .sidebar {
      width: 340px;
      background: rgba(255, 255, 255, .025);
      border-left: 1px solid rgba(255, 255, 255, .06);
      display: flex;
      flex-direction: column;
      padding: 28px 20px 20px;
    }

    .sidebar-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, .25);
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, .06);
    }

    #chat-history {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, .1) transparent;
    }

    .msg {
      display: flex;
      flex-direction: column;
      gap: 5px;
      animation: slideUp .3s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .msg .role-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .msg.user .role-label {
      color: #818cf8;
    }

    .msg.assistant .role-label {
      color: #34d399;
    }

    .msg .bubble {
      font-size: 13px;
      line-height: 1.6;
      padding: 10px 14px;
      border-radius: 10px;
      color: rgba(255, 255, 255, .82);
      border-left: 3px solid transparent;
    }

    .msg.user .bubble {
      background: rgba(99, 102, 241, .08);
      border-left-color: #818cf8;
    }

    .msg.assistant .bubble {
      background: rgba(52, 211, 153, .06);
      border-left-color: #34d399;
    }

    /* ── Search bar ────────────────────────────────────────────── */
    #search-bar {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      background: rgba(251, 191, 36, .08);
      border: 1px solid rgba(251, 191, 36, .2);
      border-radius: 8px;
      font-size: 12px;
      color: rgba(251, 191, 36, .8);
      margin-bottom: 12px;
    }

    #search-bar.visible {
      display: flex;
      animation: slideUp .3s ease;
    }

    .spinner {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      border: 2px solid rgba(251, 191, 36, .3);
      border-top-color: #fbbf24;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body class="state-sleeping">
  <div class="main">
    <div id="face-wrap">
      <div class="pulse-ring"></div>
      <div class="pulse-ring r2"></div>
      <div class="think-orbit">
        <div class="think-dot"></div>
        <div class="think-dot"></div>
        <div class="think-dot"></div>
      </div>
      <div class="zzz-wrap">
        <div class="zzz">z</div>
        <div class="zzz">z</div>
        <div class="zzz">Z</div>
      </div>

      <svg id="face" viewBox="0 0 120 120" width="280" height="280" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="fg" cx="42%" cy="35%">
            <stop offset="0%" stop-color="#FFE666" />
            <stop offset="100%" stop-color="#FFB300" />
          </radialGradient>
          <radialGradient id="blush" cx="50%" cy="50%">
            <stop offset="0%" stop-color="#FF9090" stop-opacity=".45" />
            <stop offset="100%" stop-color="#FF9090" stop-opacity="0" />
          </radialGradient>
        </defs>

        <!-- Face -->
        <circle cx="60" cy="60" r="56" fill="url(#fg)" />
        <ellipse cx="26" cy="74" rx="13" ry="8" fill="url(#blush)" />
        <ellipse cx="94" cy="74" rx="13" ry="8" fill="url(#blush)" />

        <!-- Eyes -->
        <ellipse id="eye-l" cx="40" cy="50" rx="6.5" ry="6.5" fill="#2a2a3a" />
        <ellipse id="eye-r" cx="80" cy="50" rx="6.5" ry="6.5" fill="#2a2a3a" />
        <circle id="glint-l" cx="42.5" cy="47" r="2.2" fill="white" />
        <circle id="glint-r" cx="82.5" cy="47" r="2.2" fill="white" />

        <!--
        Droopy eyelids: filled with face color to cover top of eye.
        Path: "M L,topY A 6.5,3 0 0 1 R,topY Z"
        - topY=44 → lid sits above eye (open)
        - topY=51 → lid covers bottom half of eye (sleeping)
        CSS d-transition animates between these.
      -->
        <path id="lid-l" fill="url(#fg)" d="M 33.5,43 A 6.5,3.5 0 0 1 46.5,43 Z" />
        <path id="lid-r" fill="url(#fg)" d="M 73.5,43 A 6.5,3.5 0 0 1 86.5,43 Z" />

        <!-- Eyebrows (thinking) -->
        <g id="brows" opacity="0">
          <path d="M 33 40 Q 40 35 47 38" stroke="#5a4a2a" stroke-width="2.5" fill="none" stroke-linecap="round" />
          <path d="M 73 38 Q 80 35 87 40" stroke="#5a4a2a" stroke-width="2.5" fill="none" stroke-linecap="round" />
        </g>

        <!--
        MOUTH — unified bezier structure for smooth CSS d-morphing:
        M  x1,y1  C  cx1,cy1 cx2,cy2  x2,y2   ← upper lip arc
        C  cx3,cy3 cx4,cy4  x1,y1  Z           ← lower lip / jaw arc

        All shapes have the same path command count so CSS transitions work.
      -->
        <!-- Dark inner mouth (shows when open) -->
        <path id="mouth-fill" d="M 41,79 C 52,79 68,79 79,79 C 68,79 52,79 41,79 Z" fill="#1a0a02" opacity="0" />
        <!-- Outer mouth stroke + fill -->
        <path id="mouth" d="M 38,78 C 52,74 68,74 82,78 C 68,84 52,84 38,78 Z" fill="none" stroke="#3a2010"
          stroke-width="3.2" stroke-linecap="round" />
      </svg>
    </div>

    <!-- Educational Display Overlay -->
    <div id="edu-wrap"></div>

    <div id="edu-controls">
      <!-- Main mode buttons -->
      <button class="btn-edu" id="btn-alpha" onclick="startEdu('alphabet')">Alphabet</button>
      <button class="btn-edu" id="btn-read" onclick="startEdu('reading')">Lecture</button>
      <button class="btn-edu" id="btn-count" onclick="startEdu('counting')">Compter</button>
      <button class="btn-edu" id="btn-geo"     onclick="startEdu('geography')">🌍 Géographie</button>
      <button class="btn-edu" id="btn-planets" onclick="startEdu('planets')">🪐 Planètes</button>
      <!-- Edu mode buttons (hidden by default) -->
      <button class="btn-edu btn-edu-active" id="btn-stop-tts" onclick="stopTts()">■ Stop</button>
      <button class="btn-edu btn-edu-active" id="btn-stop-edu" onclick="stopEdu()">← Menu</button>
    </div>

    <div id="status-badge">
      <div id="status-dot"></div>
      <span id="status-text">En veille</span>
    </div>

    <div id="live-text"></div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-title">Conversation</div>
    <div id="search-bar">
      <div class="spinner"></div>
      <span id="search-query">Recherche…</span>
    </div>
    <div id="chat-history"></div>
  </div>

  <script>
    // ── Mouth shapes ───────────────────────────────────────────────────────────
    // ALL use identical path format: M x1,y1 C cx1,cy1 cx2,cy2 x2,y2 C cx3,cy3 cx4,cy4 x1,y1 Z
    // so CSS transition on 'd' attribute works smoothly.
    const MOUTHS = {
      // Sleeping — flat, very slightly downturned
      sleeping: "M 40,80 C 52,79 68,79 80,80 C 68,81 52,81 40,80 Z",
      // Rest — gentle relaxed smile
      rest: "M 38,78 C 52,74 68,74 82,78 C 68,84 52,84 38,78 Z",
      // Closed — lips pressed flat (p, b, m)
      closed: "M 39,79 C 52,77 68,77 81,79 C 68,81 52,81 39,79 Z",
      // U — slightly open, rounded (f, v, schwa)

    function buildSolarSVG(hlKey) {

      // Deterministic stars (3 size classes, occasional halos + colored)

          <stop offset="100%" stop-color="#ff8000"/>
        </radialGradient>
        <radialGradient id="ssSunCorona" cx="50%" cy="50%" r="50%">
          <stop offset="0%"   stop-color="rgba(255,200,50,.40)"/>
          <stop offset="55%"  stop-color="rgba(255,140,20,.12)"/>
          <stop offset="100%" stop-color="rgba(255,100,0,0)"/>
        </radialGradient>
        <filter id="fsSun" x="-110%" y="-110%" width="320%" height="320%">
          <feGaussianBlur stdDeviation="18" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="fsSunBright" x="-100%" y="-100%" width="300%" height="300%">
          <feGaussianBlur stdDeviation="5"/>
        </filter>`;

      // Planet gradients
      Object.values(_PLANET_GRADS).forEach(g => { defs += g; });

      // Planet filters + clip paths (per planet)
      Object.entries(SOLAR_DATA).forEach(([key, d]) => {
        const isH = key === hlKey;
        defs += `<filter id="sgf_${key}" x="-130%" y="-130%" width="360%" height="360%">
          <feGaussianBlur stdDeviation="${isH ? 11 : 3}" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>`;
        const {x, y} = _ssXY(key);
        // Body clip (for surface features)
        defs += `<clipPath id="sbc_${key}"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${d.r}"/></clipPath>`;
        // Saturn front-ring clip
        if (d.ring) defs += `<clipPath id="src_${key}"><rect x="0" y="${y.toFixed(1)}" width="${W}" height="${H}"/></clipPath>`;
      });

      // Asteroid belt (Mars–Jupiter zone)
      let aseed = 99991;
      const ar = () => { aseed = (Math.imul(1664525, aseed) + 1013904223)|0; return (aseed>>>0)/4294967296; };
      const asteroids = Array.from({length: 95}, () => {
        const a = ar()*2*Math.PI, dist = 210 + ar()*36;
        return `<circle cx="${(CX+dist*Math.cos(a)).toFixed(1)}" cy="${(CY+dist*Math.sin(a)).toFixed(1)}" r="${(.5+ar()*.9).toFixed(1)}" fill="rgba(130,115,92,${(.16+ar()*.32).toFixed(2)})"/>`;
      }).join('');

      // Orbit rings
      const orbits = Object.entries(SOLAR_DATA).map(([key, d]) => {
        const isH = key === hlKey;
        const op = anyHL ? (isH ? .55 : .16) : .26;
        return `<circle cx="${CX}" cy="${CY}" r="${d.orbit}" fill="none"
          stroke="${isH?'rgba(200,200,255,'+op+')':'rgba(140,140,200,'+op+')'}"
          stroke-width="${isH?1.0:.55}" stroke-dasharray="3 9"/>`;
      }).join('');

      // Sun (3 layers + animated outer corona)
      const sun = `
        <circle cx="${CX}" cy="${CY}" r="85" fill="url(#ssSunCorona)" opacity=".75">
          <animate attributeName="r"       values="82;94;82"    dur="5s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values=".75;.40;.75" dur="5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="${CX}" cy="${CY}" r="52" fill="url(#ssSunCorona)" opacity=".55">
          <animate attributeName="r"       values="50;58;50"    dur="3.8s" repeatCount="indefinite"/>
        </circle>
        <circle cx="${CX}" cy="${CY}" r="30" fill="url(#ssSunBody)" filter="url(#fsSun)"/>
        <circle cx="${CX-8}" cy="${CY-8}" r="11" fill="rgba(255,255,240,.52)" filter="url(#fsSunBright)"/>
        <text x="${CX}" y="${CY+47}" text-anchor="middle" font-family="Inter,sans-serif"
          font-size="11" fill="rgba(255,218,70,.90)" font-weight="600" letter-spacing="1">Soleil</text>`;

      // Build planet layers
      let backRings='', pulses='', bodies='', frontRings='', nameLabels='';

      Object.entries(SOLAR_DATA).forEach(([key, d]) => {
        const isH   = key === hlKey;
        const isRev = ssRevealedKeys.includes(key);
        const op    = anyHL ? (isH ? 1.0 : 0.48) : 0.90;
        const {x, y} = _ssXY(key);
        const px = x.toFixed(1), py = y.toFixed(1);

        // Two-ring pulse for highlighted planet
        if (isH) pulses += `
          <circle cx="${px}" cy="${py}" r="${d.r}" fill="none" stroke="#fde68a" stroke-width="2.8">
            <animate attributeName="r"       values="${d.r};${d.r*5.5}" dur="1.9s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values=".90;0"              dur="1.9s" repeatCount="indefinite"/>
          </circle>
          <circle cx="${px}" cy="${py}" r="${d.r}" fill="none" stroke="#fbbf24" stroke-width="2.2">
            <animate attributeName="r"       values="${d.r};${d.r*5.5}" dur="1.9s" begin=".7s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values=".65;0"              dur="1.9s" begin=".7s" repeatCount="indefinite"/>
          </circle>`;

        // Saturn multi-band ring system
        if (d.ring) {
          const rings = _satRings(x, y, d.r, op, `src_${key}`);
          backRings += rings.back; frontRings += rings.front;
        }

        // Planet body
        bodies += `<circle cx="${px}" cy="${py}" r="${d.r}" fill="url(#spg_${key})" filter="url(#sgf_${key})" opacity="${op}"/>`;

        // Surface features (bands, craters, continents, polar caps, storms…)
        bodies += _pSurface(key, x, y, d.r, op);

        // Name label (fades in once planet is identified)
        if (isRev) {
          const ly = (y - d.r - 9).toFixed(1);
          nameLabels += `<text x="${px}" y="${ly}" text-anchor="middle"
            font-family="Inter,sans-serif" font-size="${isH?14:10}" font-weight="${isH?'700':'400'}"
            fill="${isH?'#fde68a':'rgba(255,255,255,.58)'}" letter-spacing=".5">
            ${PLANET_NAMES_FR[key]}</text>`;
        }
      });

      return `<svg id="ss-svg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"
          preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%;display:block">
        <defs>${defs}</defs>
        <rect width="${W}" height="${H}" fill="url(#ssBg)"/>
        <!-- Milky Way band -->
        <rect x="-50" y="340" width="1000" height="220" fill="url(#ssMilky)" transform="rotate(-22 ${CX} ${CY})"/>
        <!-- Nebula wisps -->
        <circle cx="120" cy="155" r="220" fill="rgba(48,26,118,.042)"/>
        <circle cx="800" cy="765" r="248" fill="rgba(88,22,98,.038)"/>
        <circle cx="762" cy="118" r="192" fill="rgba(14,44,138,.045)"/>
        ${stars}
        ${asteroids}
        ${orbits}
        ${sun}
        ${backRings}${pulses}${bodies}${frontRings}${nameLabels}
      </svg>`;
    }

    function initPlanetDisplay() {
      ssRevealedKeys = [];
      eduWrap.className = 'visible planet-mode';
      eduWrap.innerHTML = `
        <div id="planet-container">
          <div id="planet-header">
            <span id="planet-round">Planète 1</span>
            <span id="planet-score">Score : 0</span>
          </div>
          <div id="planet-svg-wrap">${buildSolarSVG(null)}</div>
          <div id="planet-clue-box"><div id="planet-clue-text">…</div></div>
        </div>`;
    }

    function showPlanet(ev) {
      const wrap = document.getElementById('planet-svg-wrap');
      if (!wrap) return;
      const key = ev.planet;
      if (ev.show_name && key && !ssRevealedKeys.includes(key)) ssRevealedKeys.push(key);
      const oldSvg  = document.getElementById('ss-svg');
      const savedVB = oldSvg ? oldSvg.getAttribute('viewBox') : `0 0 ${SS_W} ${SS_H}`;
      const hlKey   = ev.show_name ? null : key;
      wrap.innerHTML = buildSolarSVG(hlKey);
      const svg      = document.getElementById('ss-svg');
      const targetVB = ev.show_name ? `0 0 ${SS_W} ${SS_H}` : _ssZoomVB(key);
      if (svg) { svg.setAttribute('viewBox', savedVB); _animVB(svg, targetVB, 950); }
      const rEl = document.getElementById('planet-round');
      if (rEl && ev.round) rEl.textContent = `Planète ${ev.round} / ${ev.total}`;
      const sEl = document.getElementById('planet-score');
      if (sEl && ev.score !== undefined) sEl.textContent = `Score : ${ev.score}`;
      const cEl = document.getElementById('planet-clue-text');
      if (cEl) {
        const n = document.createElement('div');
        n.id = 'planet-clue-text'; n.textContent = ev.clue || '';
        cEl.replaceWith(n);
      }
    }

    function solarCleanup() {
      if (_ssAnimId) { cancelAnimationFrame(_ssAnimId); _ssAnimId = null; }
      ssRevealedKeys = [];
    }

    // ── Geography Map ─────────────────────────────────────────────────────────
    const GEO_VB_DEFAULT = '0 0 800 420';   // default full-world viewBox
    let geoSvgSel       = null;
    let geoMapReady     = false;
    let geoFlashTmr     = null;
    let geoZoomTmr      = null;
    let geoScoreVal     = 0;
    let geoHighlightQueue = [];

    function _loadScript(url) {
      return new Promise((resolve, reject) => {
        if (document.querySelector(`script[src="${url}"]`)) { resolve(); return; }
        const s = document.createElement('script');
        s.src = url; s.onload = resolve; s.onerror = reject;
        document.head.appendChild(s);
      });
    }

    // Zoom the SVG viewBox to frame a country (2× zoom centred on its bbox)
    function _zoomToCountry(numId) {
      if (!geoSvgSel) return;
      const el = document.getElementById(`gc-${numId}`);
      if (!el) return;
      try {
        const b = el.getBBox();
        if (!b.width && !b.height) return;   // empty path (e.g. tiny island)

        const aspect = 800 / 420;            // original viewBox ratio
        const pad    = Math.max(b.width, b.height, 30) * 0.9;
        const cx     = b.x + b.width  / 2;
        const cy     = b.y + b.height / 2;

        // Choose window so the country fills ~50 % of the view (≈ 2× zoom)
        let w = b.width  + 2 * pad;
        let h = b.height + 2 * pad;

        // Enforce the original aspect ratio
        if (w / h > aspect) { h = w / aspect; }
        else                 { w = h * aspect; }

        // Hard limits: never smaller than 80 units wide, never bigger than full map
        w = Math.min(Math.max(w, 80), 780);
        h = w / aspect;

        geoSvgSel.transition()
          .duration(750)
          .ease(d3.easeCubicInOut)
          .attr('viewBox', `${cx - w/2} ${cy - h/2} ${w} ${h}`);
      } catch (_) {}   // getBBox can throw for detached elements
    }

    // Smoothly zoom back to the full-world view
    function _zoomOut() {
      if (!geoSvgSel) return;
      geoSvgSel.transition()
        .duration(650)
        .ease(d3.easeCubicInOut)
        .attr('viewBox', GEO_VB_DEFAULT);
    }

    async function initGeoMap() {
      eduWrap.className = 'visible geo-mode';
      eduWrap.innerHTML = `
        <div id="geo-container">
          <div id="geo-header">
            <span id="geo-status">Chargement de la carte…</span>
            <span id="geo-score-display">Score : 0</span>
          </div>
          <svg id="world-map" viewBox="${GEO_VB_DEFAULT}" preserveAspectRatio="xMidYMid meet"></svg>
        </div>`;

      try {
        await _loadScript('https://d3js.org/d3.v7.min.js');
        await _loadScript('https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js');

        const world = await d3.json(
          'https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json'
        );

        const W = 800, H = 420;
        const proj   = d3.geoNaturalEarth1().scale(145).translate([W / 2, H / 2]);
        const pathFn = d3.geoPath().projection(proj);

        geoSvgSel = d3.select('#world-map');

        // Graticule
        geoSvgSel.append('path')
          .datum(d3.geoGraticule()())
          .attr('d', pathFn)
          .attr('fill', 'none')
          .attr('stroke', '#1e1b3a')
          .attr('stroke-width', 0.3);

        // Country paths — use .style() (inline) so highlights always win
        const countries = topojson.feature(world, world.objects.countries);
        geoSvgSel.selectAll('.geo-country')
          .data(countries.features)
          .join('path')
          .attr('class', 'geo-country')
          .attr('id', d => `gc-${d.id}`)
          .attr('d', pathFn)
          .style('fill',         '#1a1744')
          .style('stroke',       '#3d3a6b')
          .style('stroke-width', '0.4px');

        // Borders mesh on top
        geoSvgSel.append('path')
          .datum(topojson.mesh(world, world.objects.countries, (a, b) => a !== b))
          .attr('d', pathFn)
          .attr('fill', 'none')
          .attr('stroke', '#2a2760')
          .attr('stroke-width', 0.5)
          .attr('pointer-events', 'none');

        const statusEl = document.getElementById('geo-status');
        if (statusEl) statusEl.textContent = 'Quel est ce pays ?';

        geoMapReady = true;
        geoHighlightQueue.forEach(e => _applyHighlight(e));
        geoHighlightQueue = [];

      } catch (err) {
        console.error('Geo map failed:', err);
        const s = document.getElementById('geo-status');
        if (s) s.textContent = '⚠️ Carte non disponible (connexion internet requise)';
      }
    }

    function _resetAllCountries() {
      if (!geoSvgSel) return;
      geoSvgSel.selectAll('.geo-country')
        .style('fill',         '#1a1744')
        .style('stroke',       '#3d3a6b')
        .style('stroke-width', '0.4px');
    }

    function _applyHighlight(ev) {
      if (!geoSvgSel) return;
      const { id, state, score, round, total } = ev;

      // Cancel pending timers
      if (geoFlashTmr) { clearInterval(geoFlashTmr);  geoFlashTmr = null; }
      if (geoZoomTmr)  { clearTimeout(geoZoomTmr);    geoZoomTmr  = null; }

      _resetAllCountries();

      if (!id || state === 'none') {
        _zoomOut();
        return;
      }

      const el = geoSvgSel.select(`#gc-${id}`);
      if (el.empty()) return;

      if (state === 'question') {
        // Yellow pulse + zoom in on the country
        el.style('fill', '#fbbf24').style('stroke', '#f59e0b').style('stroke-width', '2px');
        let bright = true;
        geoFlashTmr = setInterval(() => {
          el.style('fill', bright ? '#fbbf24' : '#f97316');
          bright = !bright;
        }, 650);
        _zoomToCountry(id);

        const st = document.getElementById('geo-status');
        if (st && round) st.textContent = `Pays ${round} / ${total} — Quel est ce pays ?`;

      } else if (state === 'correct') {
        // Green — stay zoomed briefly then pan out
        el.style('fill', '#34d399').style('stroke', '#10b981').style('stroke-width', '2px');
        if (score !== undefined) {
          geoScoreVal = score;
          const sc = document.getElementById('geo-score-display');
          if (sc) sc.textContent = `Score : ${score}`;
        }
        geoZoomTmr = setTimeout(_zoomOut, 1100);

      } else if (state === 'reveal') {
        // Red — stay zoomed briefly then pan out
        el.style('fill', '#f87171').style('stroke', '#ef4444').style('stroke-width', '2px');
        geoZoomTmr = setTimeout(_zoomOut, 1100);
      }
    }

    function geoHighlight(id, state, score, round, total) {
      const ev = { id, state, score, round, total };
      if (!geoMapReady) { geoHighlightQueue.push(ev); return; }
      _applyHighlight(ev);
    }

    function geoCleanup() {
      if (geoFlashTmr) { clearInterval(geoFlashTmr); geoFlashTmr = null; }
      if (geoZoomTmr)  { clearTimeout(geoZoomTmr);   geoZoomTmr  = null; }
      geoSvgSel = null; geoMapReady = false; geoScoreVal = 0; geoHighlightQueue = [];
    }

    // ── WebSocket ──────────────────────────────────────────────────────────────
    function connect() {
      const ws = new WebSocket(`ws://${location.host}/ws`);
      wsConnection = ws;

      ws.onmessage = ({ data }) => {
        const ev = JSON.parse(data);
        switch (ev.type) {
          case 'state': setState(ev.state); break;
          case 'viseme': setViseme(ev.viseme); break;
          case 'token': liveText.textContent += ev.token; break;
          case 'message':
            addMessage(ev.role, ev.content);
            if (ev.role === 'user') liveText.textContent = '';
            break;
          case 'search':
            searchQ.textContent = `🔍 ${ev.query}`;
            searchBar.classList.add('visible');
            break;
          case 'edu_display':
            toggleEduMode(true);
            eduWrap.className = 'visible'; // reset specific grid classes
            eduWrap.innerHTML = `<span class="edu-letter">${ev.text}</span>`;
            break;
          case 'edu_grid':
            toggleEduMode(true);
            eduWrap.className = `visible ${ev.gridClass || ''}`;
            eduWrap.innerHTML = ev.items.map((item, i) => `<span class="edu-letter" id="edu-item-${i}">${item}</span>`).join('');
            break;
          case 'edu_reading':
            toggleEduMode(true);
            eduWrap.className = 'visible'; // reset specific grid classes
            eduWrap.innerHTML = ev.word.split('').map((char, i) => `<span class="edu-letter" id="edu-item-${i}">${char}</span>`).join('');
            break;
          case 'edu_reading_zoom':
            const letters = eduWrap.querySelectorAll('.edu-letter');
            letters.forEach((l, i) => {
              if (i === ev.index) l.classList.add('zoom');
              else l.classList.remove('zoom');
            });
            break;
          case 'edu_reading_unzoom':
            eduWrap.querySelectorAll('.edu-letter').forEach(l => l.classList.remove('zoom'));
            break;
          case 'edu_hide':
            toggleEduMode(false);
            break;
          case 'planet_start':
            toggleEduMode(true);
            initPlanetDisplay();
            break;
          case 'planet_show':
            showPlanet(ev);
            break;
          case 'geo_start':
            toggleEduMode(true);
            initGeoMap();   // async — highlights are queued until ready
            break;
          case 'geo_highlight':
            geoHighlight(ev.id, ev.state, ev.score, ev.round, ev.total);
            break;
        }
      };
      ws.onclose = () => setTimeout(connect, 2000);
      ws.onerror = () => ws.close();
    }
    connect();

    // Init sleeping state
    setState('sleeping');
  </script>
</body>
